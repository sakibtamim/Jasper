<!doctype html>
<html lang="en" class="light" style="scroll-behavior: smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jasper - Heavenly Council Dashboard</title>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Lucide Icons -->
        <script src="https://cdn.jsdelivr.net/npm/lucide@0.378.0/dist/umd/lucide.min.js"></script>

        <!-- Custom Styles -->
        <link rel="stylesheet" href="index.css" />
        
        <style>
            /* Custom scrollbar for logs */
            .logs-container::-webkit-scrollbar {
                width: 8px;
            }
            .logs-container::-webkit-scrollbar-track {
                background: #1f2937;
            }
            .logs-container::-webkit-scrollbar-thumb {
                background: #4b5563;
                border-radius: 4px;
            }
            .logs-container::-webkit-scrollbar-thumb:hover {
                background: #6b7280;
            }
        </style>
    </head>

    <body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">
        <!-- Header / Navbar -->
        <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 fixed top-0 left-0 right-0 z-50 h-20">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-20">
                    <!-- Logo Container -->
                    <div class="flex items-center gap-3">
                        <div class="h-10 w-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                            J
                        </div>
                        <span class="text-xl font-bold text-gray-900 dark:text-white">Jasper Dashboard</span>
                    </div>

                    <!-- Desktop Nav -->
                    <nav class="hidden lg:flex items-center space-x-2">
                        <a href="#workers" class="px-3 py-2 rounded-md text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Workers</a>
                        <a href="#queues" class="px-3 py-2 rounded-md text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Queues</a>
                        <a href="#cache" class="px-3 py-2 rounded-md text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Cache</a>
                        <a href="#logs" class="px-3 py-2 rounded-md text-sm font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Logs</a>
                        
                        <!-- Dark Mode Toggle -->
                        <button id="theme-toggle" type="button" class="ml-4 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm p-2.5">
                            <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                            <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                        </button>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16 mt-10">
            
            <!-- Workers Section -->
            <section id="workers" class="mb-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-3">
                    <i data-lucide="users" class="w-8 h-8 text-indigo-500"></i>
                    Heavenly Council
                </h2>
                <div id="workers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Worker cards will be injected here -->
                    <div class="animate-pulse bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 h-48"></div>
                    <div class="animate-pulse bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 h-48"></div>
                    <div class="animate-pulse bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 h-48"></div>
                </div>
            </section>

            <!-- Active Queues Section -->
            <section id="queues" class="mb-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-3">
                    <i data-lucide="music" class="w-8 h-8 text-pink-500"></i>
                    Active Queues
                </h2>
                <div id="queues-container" class="space-y-4">
                    <!-- Queue items will be injected here -->
                    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-700 text-center text-gray-500">
                        No active queues right now.
                    </div>
                </div>
            </section>

            <!-- Cache Stats Section -->
            <section id="cache" class="mb-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-3">
                    <i data-lucide="database" class="w-8 h-8 text-emerald-500"></i>
                    Cache Statistics
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border-l-4 border-emerald-500">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium uppercase tracking-wider">Search Cache</h3>
                        <p id="stats-search" class="text-3xl font-bold text-gray-900 dark:text-white mt-2">0 entries</p>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border-l-4 border-blue-500">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium uppercase tracking-wider">Audio Files</h3>
                        <p id="stats-files" class="text-3xl font-bold text-gray-900 dark:text-white mt-2">0 files</p>
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-lg border-l-4 border-purple-500">
                        <h3 class="text-gray-500 dark:text-gray-400 text-sm font-medium uppercase tracking-wider">Storage Used</h3>
                        <p id="stats-size" class="text-3xl font-bold text-gray-900 dark:text-white mt-2">0 MB</p>
                    </div>
                </div>
            </section>

            <!-- Logs Section -->
            <section id="logs" class="mb-12">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 flex items-center gap-3">
                    <i data-lucide="terminal" class="w-8 h-8 text-gray-500"></i>
                    Activity Logs
                </h2>
                <div class="bg-gray-900 rounded-2xl shadow-lg overflow-hidden border border-gray-700">
                    <div class="flex items-center justify-between px-4 py-2 bg-gray-800 border-b border-gray-700">
                        <div class="flex space-x-2">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        </div>
                        <span class="text-xs text-gray-400 font-mono">jasper-bot.log</span>
                    </div>
                    <div id="logs-container" class="logs-container p-4 h-96 overflow-y-auto font-mono text-sm text-gray-300 space-y-1">
                        <!-- Logs will be injected here -->
                        <div class="text-gray-500 italic">Waiting for logs...</div>
                    </div>
                </div>
            </section>

        </main>

        <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-8">
            <div class="container mx-auto px-4 text-center text-gray-500 dark:text-gray-400">
                <p>&copy; 2025 Jasper Music Bot. All rights reserved.</p>
            </div>
        </footer>

        <!-- Application Logic -->
        <script src="index.js"></script>
    </body>
</html>
