<svg xmlns="http://www.w3.org/2000/svg"
     width="170" height="32" viewBox="0 0 170 32" role="img">
  <defs>
    <!-- PSL-style gradient -->
    <linearGradient id="cspGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5BE7E3"/>
      <stop offset="50%" stop-color="#2BB0FF"/>
      <stop offset="100%" stop-color="#A639FF"/>
    </linearGradient>

    <style>
      .label {
        font-family: "Segoe UI", -apple-system, Ubuntu, sans-serif;
        font-size: 13px;
        font-weight: 600;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="170" height="32" rx="6" fill="url(#cspGrad)"/>

  <!-- Paw icon (simple, flat, no extra padding) -->
  <circle cx="18" cy="16" r="5" fill="#ffffff" opacity="0.95"/>
  <circle cx="10.5" cy="10" r="2.3" fill="#ffffff" opacity="0.9"/>
  <circle cx="14.5" cy="8.5" r="2.3" fill="#ffffff" opacity="0.9"/>
  <circle cx="21.5" cy="8.5" r="2.3" fill="#ffffff" opacity="0.9"/>
  <circle cx="25.5" cy="10" r="2.3" fill="#ffffff" opacity="0.9"/>

  <!-- Text -->
  <text x="100" y="16" text-anchor="middle"
        class="label" fill="#ffffff">
    CSP-IP Certified
  </text>
</svg>
