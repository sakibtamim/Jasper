<svg xmlns="http://www.w3.org/2000/svg" width="230" height="40" role="img">
  <defs>
    <!-- LIGHT MODE GRADIENT -->
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5BE7E3"/>
      <stop offset="50%" stop-color="#2BB0FF"/>
      <stop offset="100%" stop-color="#A639FF"/>
    </linearGradient>

    <!-- DARK MODE GRADIENT -->
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D1CC"/>
      <stop offset="50%" stop-color="#1D89FF"/>
      <stop offset="100%" stop-color="#9031FF"/>
    </linearGradient>

    <style>
      :root {
        --bg: url(#gradLight);
        --text: #1A1A1A;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: url(#gradDark);
          --text: #FFFFFF;
        }
      }
      text {
        font-family: 'Segoe UI', Ubuntu, sans-serif;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="230" height="40" rx="8" fill="var(--bg)" />

  <!-- Left paw icon (minimalist) -->
  <circle cx="25" cy="20" r="6" fill="white" opacity="0.95"/>
  <circle cx="15" cy="14" r="3" fill="white" opacity="0.9"/>
  <circle cx="20" cy="10" r="3" fill="white" opacity="0.9"/>
  <circle cx="30" cy="10" r="3" fill="white" opacity="0.9"/>
  <circle cx="35" cy="14" r="3" fill="white" opacity="0.9"/>

  <!-- Text -->
  <text x="60" y="25" fill="var(--text)">CSP-IP Certified</text>
</svg>
