<svg xmlns="http://www.w3.org/2000/svg" width="120" height="32" viewBox="0 0 120 32" role="img">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C98A"/>
      <stop offset="100%" stop-color="#A639FF"/>
    </linearGradient>

    <style>
      text {
        font-family: "Segoe UI", -apple-system, Ubuntu, sans-serif;
        font-size: 13px;
        font-weight: 600;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Left gray block -->
  <rect width="55" height="32" fill="#555"/>

  <!-- Right gradient block -->
  <rect x="55" width="65" height="32" fill="url(#badgeGrad)"/>

  <!-- Text (centered vertically now) -->
  <text x="27.5" y="16" text-anchor="middle" fill="#fff">license</text>
  <text x="87.5" y="16" text-anchor="middle" fill="#fff">MIT</text>
</svg>
